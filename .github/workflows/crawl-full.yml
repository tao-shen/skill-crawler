name: Full Crawl

on:
  schedule:
    - cron: '0 3 * * *'  # Daily 3am UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: crawl-full
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run full crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRAWL_MODE: full
        run: node scripts/crawl.js

      - name: Commit and push changes
        run: |
          git config user.name "skill-crawler[bot]"
          git config user.email "skill-crawler[bot]@users.noreply.github.com"
          git add data/skills.json feed.xml
          if git diff --staged --quiet; then
            echo "No new skills found"
          else
            TOTAL=$(python3 -c "import json; print(json.load(open('data/skills.json'))['total_count'])")
            git commit -m "chore: update skills — ${TOTAL} total [full] ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
