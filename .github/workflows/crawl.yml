name: Crawl GitHub Skills

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours (crawler now takes longer due to license fetching)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: crawl
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl.js

      - name: Commit and push changes
        run: |
          git config user.name "skill-crawler[bot]"
          git config user.email "skill-crawler[bot]@users.noreply.github.com"
          git add data/skills.json feed.xml
          if git diff --staged --quiet; then
            echo "No new skills found"
          else
            TOTAL=$(python3 -c "import json; print(json.load(open('data/skills.json'))['total_count'])")
            git commit -m "chore: update skills data — ${TOTAL} skills ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
