name: Crawl GitHub Skills

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run crawler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/crawl.js

      - name: Commit and push changes
        run: |
          git config user.name "skill-crawler[bot]"
          git config user.email "skill-crawler[bot]@users.noreply.github.com"
          git add data/skills.json feed.xml
          if git diff --staged --quiet; then
            echo "No new skills found"
          else
            git commit -m "chore: update skills data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
